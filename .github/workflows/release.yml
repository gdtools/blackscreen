name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 file

      - name: Build x64 (static, no extra DLLs)
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -mwindows -static \
            blackscreen.c -o blackscreen.exe

      - name: Verify artifact
        run: |
          file blackscreen.exe
          test -s blackscreen.exe
          sha256sum blackscreen.exe | tee blackscreen.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackscreen-x64
          path: |
            blackscreen.exe
            blackscreen.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            blackscreen.exe
            blackscreen.exe.sha256
